<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
    </script>
    <link rel="stylesheet" href="/css/table.css" th:href="@{/css/table.css}"/>
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}"/>
    <link rel="shortcut icon" href="#"/>

</head>
<body>
<div th:replace="~{fragments::header}">
</div>

<div class="container mt-3 text-center">
    <!-- Error Image -->

    <img th:src="@{/images/sad.jpg}" alt="Beer Project" class="logo" style="height: 150px;">
    <h1>Order Error!</h1>
    <br>
   <h2 class="text-danger"><span th:text="${errorMessage}">Error Message</span></h2>
    <p>Go back and try again!</p>

    <div class="position-relative text-center start-50 translate-middle-x mt-4">
        <button class="btn btn-primary bg-black text-white text-decoration-none text-center" onclick="history.back()">Go back!</button>
    </div>
</div>


<div th:replace="~{fragments::footer}">
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
    </script>
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}"/>
    <link rel="shortcut icon" href="#"/>

</head>
<body>
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
<h1>All Customers!</h1>
</div>

<div class="container mt-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 justify-content-center">
        <!-- individual card -->
        <div class="col " th:each="customer : ${customers}">
                <div class="card h-100 shadow-sm rounded text-center">
                    <a th:href="@{/customer/delete(id=${customer.getIdCustomer()})}"
                       class="btn btn-dark btn-sm custom-delete-btn position-absolute top-0 end-0 m-2"
                       onclick="return confirm('Are you sure you want to delete this Customer?');">
                        &times;
                    </a>
                    <a href="detail/detailBeer.html" th:href="@{/customer/detailCustomer(idCus=${customer.getIdCustomer()})}" class="text-decoration-none">

                    <img th:src="${customer.getImageUrl()}" class="card-img-top img-fluid w-50 mx-auto mt-4" alt="beer">
                    <div class="card-body text-black">
                        <h5 class="card-title"  th:text="${customer.getContact()}">Contact</h5>
                        <p class="card-text" th:text="${customer.getCompanyName()}" >Company</p>
                    </div>
                    </a>
                </div>
        </div>
    </div>
    <div class="position-relative text-center start-50 translate-middle-x mt-4">
        <a class="btn btn-primary bg-black text-white text-decoration-none text-center"
           th:href="@{/customer/add}">
            + Add Customer
        </a>
    </div>
</div>

</html>

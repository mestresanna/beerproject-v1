<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Costumer</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
    </script>
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
<h1>Add Customer</h1>
</div>


<div class="container col-sm-8">
<form class="row justify-content-md-center" th:object="${customerViewModel}" th:method="post" th:action="@{/customer/add}">
    <div class="mb-3 col-md-6 col-sm-12">
        <label for="contact" class="form-label">Name</label>
        <input type = "text" name = "contact" id = "contact" class = "form-control"  th:field="*{contact}"/>
        <div th:if="${#fields.hasErrors('contact')}" class="text-danger">
            <p th:errors="*{contact}">Invalid Contact Name</p>
        </div>
    </div>
    <div class="mb-3 col-md-6 col-sm-12">
        <label for="companyName" class="form-label">Company Name</label>
        <input type = "text" name = "companyName" id = "companyName" class = "form-control"  th:field="*{companyName}"/>
        <div th:if="${#fields.hasErrors('companyName')}" class="text-danger">
            <p th:errors="*{companyName}">Invalid Name</p>
        </div>
    </div>
        <div class="mb-3 col-md-12 col-sm-12">
        <label for="address" class="form-label">Address</label>
        <input type = "text" name = "address" id = "address" class = "form-control"  th:field="*{address}"/>
            <div th:if="${#fields.hasErrors('address')}" class="text-danger">
                <p th:errors="*{address}">Invalid address</p>
            </div>
    </div>
    <div class="mb-3 col-md-6 col-sm-12">
        <label for="email" class="form-label">Email</label>
        <input type = "text" name = "email" id = "email" class = "form-control"  th:field="*{email}"/>
        <div th:if="${#fields.hasErrors('email')}" class="text-danger">
            <p th:errors="*{email}">Invalid email</p>
        </div>

    </div>
    <div class="mb-3 col-md-6 col-sm-12">
        <label for="phone" class="form-label">Phone Number</label>
        <input type = "text" name = "phone" id = "phone" class = "form-control"  th:field="*{phone}"/>
        <div th:if="${#fields.hasErrors('phone')}" class="text-danger">
            <p th:errors="*{phone}">Invalid phone</p>
        </div>

    </div>

        <button type="submit" class="btn btn-primary col-md-3 bg-black text-white">Submit</button>
</form>
</div>

<div th:replace="~{fragments::footer}">
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Beer</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
    </script>
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}"/>

</head>
<body>
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
    <h1>Add Beer</h1>
</div>

<div class="container col-sm-8">

<form class="row justify-content-md-center" th:object="${beerViewModel}" th:method="post" th:action="@{/beers/add}">
    <div class="mb-3 col-md-6">
        <label for="name" class="form-label">Name</label>
        <input type = "text" name = "name" id = "name" class="form-control" required th:field="*{name}"/>
        <div th:if="${#fields.hasErrors('name')}" class="text-danger">
            <p th:errors="*{name}">Invalid Name</p>
        </div>
    </div>
    <div class="mb-3 col-md-6">
        <label for="brewery" class="form-label">Brewery</label>
        <input type = "text" name = "brewery" id = "brewery" class="form-control" required th:field="*{brewery}"/>
    </div>
    <div class="mb-3 col-md-3">
        <label for="abv" class="form-label">Abv</label>
        <input type = "number" step="0.01" name = "abv" id = "abv" class="form-control" required th:field="*{abv}"/>
    </div>
    <div class="mb-3 col-md-3">
        <label for="plato" class="form-label">plato</label>
        <input type = "number" step="0.01" name = "plato" id = "plato" class="form-control" th:field="*{plato}" required/>
    </div>
    <div class="mb-3 col-md-6">
        <label for="style" class="form-label">style</label>
        <input type = "text" name = "style" id = "style" class="form-control" required th:field="*{style}"/>
    </div>
    <div class="mb-3 col-md-6">
        <label for="quantity" class="form-label">Quantity</label>
        <select id="quantity" name="quantity" class="form-select" required>
            <option th:each="beerQuantity : ${quantity}"  th:text="${beerQuantity}" th:value="${beerQuantity}" th:field="*{quantity}"/>
        </select>
    </div>

    <div class="mb-3 col-md-6">
        <label for="containers" class="form-label">Container</label>
        <select id="containers" name="containers" class="form-select" required>
            <option th:each="beerContainer : ${container}" th:value="${beerContainer}" th:text="${beerContainer}" th:field="*{containers}"/>
            </option>
        </select>
    </div>

    <div class="mb-3 col-md-6">
        <label for="stock" class="form-label">Stock</label>
        <input type = "number" name = "stock" id = "stock" class="form-control" required th:field="*{stock}"/>
    </div>

    <div class="mb-3 col-md-6">
        <label for="price" class="form-label">Price</label>
        <input type = "number" step="0.01" name = "price" id = "price" class="form-control" required th:field="*{price}"/>
    </div>
    <button type="submit" class="btn btn-primary col-md-3 bg-black text-white">Submit</button>
</form>
</div>

<div th:replace="~{fragments::footer}">
</div>
</body>
</html>

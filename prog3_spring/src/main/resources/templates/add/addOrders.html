<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Order</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
    </script>
    <link rel="stylesheet" th:href="@{/css/images.css}" href="../static/css/images.css">
    <script>
        function addBeerEntry() {
            const beerList = document.getElementById('beer-list');
            const beerEntries = document.querySelectorAll('.beer-entry');
            const newEntry = beerEntries[0].cloneNode(true);

            // Actualitzar l'índex de la nova entrada
            const newIndex = beerEntries.length;
            newEntry.querySelectorAll('select, input').forEach((element) => {
                if (element.name) {
                    element.name = element.name.replace(/\[\d+\]/, `[${newIndex}]`);
                }
                if (element.id) {
                    element.id = element.id.replace(/\[\d+\]/, `[${newIndex}]`);
                }
                element.value = ''; // Netejar els valors
            });

            beerList.appendChild(newEntry);
        }
    </script>
</head>
<body>
<div th:replace="~{fragments::header}">
</div>

<div class="container mt-5">
<h1>Add Order</h1>
</div>

<div class="container col-sm-8">
    <form class="row justify-content-md-center" th:object="${order}" th:method="post" th:action="@{/orders/add}">
        <div class="mb-3 col-sm-12">
            <label for="customer" class="form-label">Costumer</label>
            <select id="customer" name="customer" class="form-select" th:field="*{customer}" >
                <option th:each="customer : ${customers}" th:value="${customer.idCustomer}" th:text="${customer.contact}" />
            </select>
            <div th:if="${#fields.hasErrors('customer')}" class="text-danger">
                <p th:errors="*{customer}">Invalid Customer</p>
            </div>
        </div>

        <div id="beer-list">
            <div th:each="beerEntry, stat : *{beersList}" class="beer-entry row mb-3">
                <div class="col-md-9">
                    <label class="form-label">Beer</label>
                    <select class="form-select" th:field="*{beersList[__${stat.index}__].beer}" >
                      <!--  <option selected value="">Select a beer</option>-->
                        <option th:each="beer : ${beers}" th:value="${beer.idBeer}" th:text="${beer.name}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('beersList[__${stat.index}__].beer')}" class="text-danger">
                        <p th:errors="*{beersList[__${stat.index}__].beer}">Invalid beer</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Stock</label>
                    <input type="number" class="form-control" th:field="*{beersList[__${stat.index}__].stock}" />
                    <div th:if="${#fields.hasErrors('beersList[__${stat.index}__].beer')}" class="text-danger">
                        <p th:errors="*{beersList[__${stat.index}__].beer}">Invalid Stock</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <button type="button" class="btn border-black text-black" onclick="addBeerEntry()">Add Another Beer</button>
        </div>

        <div class="mb-3 col-md-12">
            <label for="comments" class="form-label">Comments</label>
            <textarea type = "text" name = "comments" id = "comments" class="form-control" th:field="*{comments}"></textarea>
        </div>

        <button type="submit" class="btn btn-primary col-md-3 bg-black text-white">Submit</button>
    </form>
</div>


<div th:replace="~{fragments::footer}">
</div>

</body>


</html>

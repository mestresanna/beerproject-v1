<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Costumer</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
    </script>
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
<h1>Add Customer</h1>
</div>

<form>
    <div class="mb-3">
        <label for="contact" class="form-label">Name</label>
        <input type = "text" name = "contact" id = "contact" class = "form-control"/>

    </div>
    <div class="mb-3">
        <label for="companyName" class="form-label">Company Name</label>
        <input type = "text" name = "companyName" id = "companyName" class = "form-control"/>

    </div>
    <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type = "text" name = "address" id = "address" class = "form-control"/>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type = "text" name = "email" id = "email" class = "form-control"/>

    </div>
    <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type = "text" name = "phone" id = "phone" class = "form-control"/>

    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
</form>

<div th:replace="~{fragments::footer}">
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${customer.contact}">Customer</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
  </script>
  <link rel="stylesheet" href="../../static/css/table.css" th:href="@{/css/table.css}"/>
</head>
<body th:object="${customer}">
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
  <h1 th:text="*{contact}">Contact</h1>
</div>

<div class="container mt-5 text-center">
  <img th:src="${customer.getImageUrl()}" class="card-img-top w-25 mx-auto" alt="customer">
</div>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <table class="table table-striped table-hover">
        <thead class="table-light">
          <tr>
            <th scope="col">Company Name</th>
            <th scope="col">Address</th>
            <th scope="col">Email</th>
            <th scope="col">Phone</th>
          </tr>
          </thead>
          <tbody class="table-group-divider">
          <tr>
            <td th:text="*{companyName}">HB</td>
            <td th:text="*{address}">Gijselsstraat</td>
            <td th:text="*{email}">hola@hb.com</td>
            <td th:text="*{phone}">+32 45678901</td>
          </tr>
          </tbody>
      </table>
    </div>
  </div>
</div>
<div class="container mt-5">
  <h2>Orders history</h2>
</div>
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <table class="table table-striped table-hover">
        <thead class="table-light">
        <tr>
          <th scope="col">OrderId</th>
          <th scope="col">Beers</th>
          <th scope="col">Comments</th>
          <th scope="col">Date</th>
          <th scope="col">Total €</th>
        </tr>
        </thead>
        <tbody class="table-group-divider text-center">
        <tr th:each="order : ${orderList}">
          <td>
            <a href="/orders/detailOrder.html" th:href="@{/orders/detailOrder(idOrder=${order.getIdOrder()})}" class="text-decoration-none">
              <h4 th:text="${order.getIdOrder()}"></h4>
            </a></td>
          <td th:text="${order.getBeers().keySet()}"></td>
          <td th:text="${order.getComments()}"></td>
          <td th:text="${order.getDate()}"></td>
          <td th:text="${order.getTotal()}"></td>
        </tbody>
      </table>
    </div>
  </div>
</div>



<div th:replace="~{fragments::footer}">
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${beer.name}">Beer</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
  </script>
  <link rel="stylesheet" href="../../static/css/table.css" th:href="@{/css/table.css}"/>
</head>
<body th:object="${beer}">
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
<h1 th:text="*{name}">Beer</h1>
</div>

<div class="container mt-5 text-center">
  <img th:src="${beer.getImageUrl()}" class="card-img-top w-25 mx-auto" alt="beer">
</div>


<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <table class="table table-striped table-hover">
        <thead class="table-light">
        <tr>
          <th scope="col">Brewery</th>
          <th scope="col">Style</th>
          <th scope="col">Alcohol</th>
          <th scope="col">Stock</th>
          <th scope="col">Price</th>
          <th scope="col">Quantity</th>
          <th scope="col">Containers</th>
        </tr>
        </thead>
        <tbody class="table-group-divider">
        <tr>
           <td th:text="*{brewery}"></td>
           <td th:text="*{style}"></td>
          <td th:text="*{abv}"></td>
          <td th:text="*{stock}"></td>
          <td th:text="*{price}"></td>
          <td th:text="*{quantity.getSize()}"></td>
          <td th:text="*{containers.getName()}"></td>
         </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div class="container mt-5">
<h2>Orders history</h2>
</div>
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <table class="table table-striped table-hover">
        <thead class="table-light">
        <tr>
          <th scope="col">OrderId</th>
          <th scope="col">Contact</th>
          <th scope="col">Date</th>
          <th scope="col">Total Amount of this beer</th>
        </tr>
        </thead>
        <tbody class="table-group-divider text-center">
       <tr th:each="order : ${orderList}">
         <td>
           <a href="/orders/detailOrder.html" th:href="@{/orders/detailOrder(idOrder=${order.getIdOrder()})}" class="text-decoration-none">
             <h4 th:text="${order.getIdOrder()}"></h4>
           </a></td>
         <td>
           <a href="/customer/detailCustomer.html" th:href="@{/customer/detailCustomer(idCus=${order.getCustomer().getIdCustomer()})}" class="text-decoration-none">
             <h4 th:text="${order.getCustomer().getContact()}"></h4>
           </a></td>
          <td th:text="${order.getDate()}"></td>

         <td th:text="${order.getStockToBeer(beer.getIdBeer())}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>



<div th:replace="~{fragments::footer}">
</div>

</body>
</html>

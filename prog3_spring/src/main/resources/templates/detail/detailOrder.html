<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'Order ' + ${order.idOrder}">Order</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
  </script>
  <link rel="stylesheet" href="../../static/css/table.css" th:href="@{/css/table.css}"/>
</head>
<body th:object="${order}">
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
  <h1>Order Detail</h1>
</div>

<div class="container mt-5 text-center">
  <img th:src="${order.getImageUrl()}" class="card-img-top w-25 mx-auto" alt="beer">
</div>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <table class="table table-striped table-hover">
        <thead class="table-light">
        <tr>
          <th scope="col">Order ID</th>
          <th scope="col">Customer</th>
          <th scope="col">Comments</th>
          <th scope="col">Date</th>
          <th scope="col">Total Price</th>
        </tr>
        </thead>
        <tbody class="table-group-divider">
        <tr>

          <td th:text="${order.getIdOrder()}"></td>
          <td>
            <a href="/customer/detailCustomer.html" th:href="@{/customer/detailCustomer(idCus=${order.getCustomer().getIdCustomer()})}" class="text-decoration-none">
              <h4 th:text="${order.getCustomer().getContact()}"></h4>
            </a></td>
          <td th:text="${order.getComments()}"></td>
          <td th:text="${order.getDate()}"></td>
          <td th:text="${order.getTotal()}"></td>
        </tr>
          </tbody>
      </table>
    </div>
  </div>
</div>
<div class="container mt-5">
  <h2>List of Beers</h2>
</div>
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <table class="table table-striped table-hover">
        <thead class="table-light">
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Brewery</th>
          <th scope="col">Quantity</th>
          <th scope="col">Containers</th>
          <th scope="col">Price</th>
          <th scope="col">Amount</th>
          <th scope="col">Delete Beer</th>
        </tr>
        </thead>
        <tbody class="table-group-divider text-center" >
        <tr  th:each="beer : ${order.getBeers()}">
          <td>
            <a href="/beers/detailBeer.html" th:href="@{/beers/detailBeer(idBeer=${beer.getKey().getIdBeer()})}" class="text-decoration-none">
              <h4 th:text="${beer.getKey().getName()}">Beer Name</h4>
            </a></td>
          <td th:text="${beer.getKey().getBrewery()}"></td>
          <td th:text="${beer.getKey().getQuantity().getSize()}"></td>
          <td th:text="${beer.getKey().getContainers().getName()}"></td>
          <td th:text="${beer.getKey().getPrice()}"></td>
          <td th:text="${beer.getValue()}"></td>
          <td>
            <a th:href="@{/orders/delete/beer(idOrder=${order.getIdOrder()}, id=${beer.getKey().getIdBeer()})}" class="text-danger" style="text-decoration: none;"
               onclick="return confirm('Are you sure you want to delete this Beer from the Order?');">
              ❌</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>



<div th:replace="~{fragments::footer}">
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
    </script>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}"/>
    <link rel="shortcut icon" href="#"/>

</head>
<body>
<div th:replace="~{fragments::header}">
</div>

<div class="container mt-5">
<h1>Beer Project</h1>
</div>

<div class="container mt-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4 justify-content-center">
        <!-- Targeta individual -->
        <div class="col">
            <a th:href="@{/beers}" class="text-decoration-none">
            <div class="card h-100 shadow-sm rounded text-center">
                <img th:src="@{/images/beers.png}" class="card-img-top img-fluid w-50 mx-auto" alt="beer">
                <div class="card-body">
                    <h5 class="card-title">Beer</h5>
                    <p class="card-text">List of all the beers</p>
                </div>
            </div>
            </a>
        </div>

        <!-- Segona targeta -->
        <div class="col">
            <a th:href="@{/customer}" class="text-decoration-none">
            <div class="card h-100 shadow-sm rounded text-center">
                <img th:src="@{/images/customers.png}" class="card-img-top img-fluid w-50 mx-auto" alt="customer">
                <div class="card-body">
                    <h5 class="card-title">Customers</h5>
                    <p class="card-text">List of all customers</p>
                </div>
            </div>
            </a>
        </div>

        <!-- Tercera targeta -->
        <div class="col">
            <a th:href="@{/orders}" class="text-decoration-none">
            <div class="card h-100 shadow-sm rounded text-center">
                <img th:src="@{/images/shopping-cart.png}" class="card-img-top img-fluid w-50 mx-auto" alt="orders">
                <div class="card-body">
                    <h5 class="card-title">Orders</h5>
                    <p class="card-text">List of all Orders</p>
                </div>
            </div>
            </a>
        </div>

        <!-- Quarta targeta -->
        <div class="col">
            <a th:href="@{/beers/add}" class="text-decoration-none">
            <div class="card h-100 shadow-sm rounded text-center">
                <img th:src="@{/images/logo.png}" class="card-img-top img-fluid w-50 mx-auto" alt="add beer">
                <div class="card-body">
                    <h5 class="card-title">Add Beer</h5>
                    <p class="card-text">Create a new beer</p>
                </div>
            </div>
            </a>
        </div>

        <!-- Cinquena targeta -->
        <div class="col">
            <a th:href="@{/customer/add}" class="text-decoration-none">
            <div class="card h-100 shadow-sm rounded text-center">
                <img th:src="@{/images/person.png}" class="card-img-top img-fluid w-50 mx-auto" alt="add customer">
                <div class="card-body">
                    <h5 class="card-title">Add Customers</h5>
                    <p class="card-text">Create a new customer</p>
                </div>
            </div>
            </a>
        </div>

        <!-- Sisena targeta -->
        <div class="col">
            <a th:href="@{/orders/add}" class="text-decoration-none">
            <div class="card h-100 shadow-sm rounded text-center">
                <img th:src="@{/images/add_order.png}" class="card-img-top img-fluid w-50 mx-auto" alt="add orders">
                <div class="card-body">
                    <h5 class="card-title">Add Orders</h5>
                    <p class="card-text">Create a new order</p>
                </div>
            </div>
            </a>
        </div>
    </div>
</div>


<div th:replace="~{fragments::footer}">
</div>

</body>
</html>

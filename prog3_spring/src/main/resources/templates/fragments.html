<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Header</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
  </script>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
</head>
<body>
<div th:fragment="header">
  <nav class="navbar bg-dark border-bottom border-body navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Beer Project</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle"  role="button" data-bs-toggle="dropdown" aria-expanded="false" th:href="@{/beers}">Beer</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/beers}">Beers</a></li>
              <li><a class="dropdown-item" th:href="@{/beers/add}">Add Beer</a></li>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false" th:href="@{/costumer}">Costumers</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/costumer}">Customer</a></li>
              <li><a class="dropdown-item" th:href="@{/costumer/add}">Add Customer</a></li>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false" th:href="@{/orders}">Orders</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/orders}">Orders</a></li>
              <li><a class="dropdown-item" th:href="@{/orders/add}">Add Orders</a></li>
            </ul>
          </li>

        </ul>
      </div>
    </div>
  </nav>
</div>

<div th:fragment="footer" class="navbar navbar-fixed-bottom">
  <footer class="bg-light text-center text-lg-start">
    <p> &COPY; KdG 2024</p>
  </footer>
</div>

</body>
</html>

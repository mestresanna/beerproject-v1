<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Beer</title>
</head>
<body>
<div>
    <a href="/beer">All Beers</a> |
    <a href="/costumer">All Costumers</a> |
    <a href="/orders">All Orders</a> |
    <a href="/beer/add">Add a Beer</a> |
    <!-- <a href="/orders">Add an Order</a> |
     <a href="/orders">Add a Costumer</a> |-->
</div>

<h1>Add Beer</h1>
<form method="post">
  <label for="name">Name</label><input type = "text" name = "name" id = "name"/>
  <br>
    <label for="name">Abv</label><input type = "text" name = "abv" id = "abv"/>
    <br>
    <label for="name">plato</label><input type = "text" name = "plato" id = "plato"/>
    <br>
    <label for="name">style</label><input type = "text" name = "style" id = "style"/>
    <br>
  <label for="quantity">Quantity</label>
  <select id="quantity" name="quantity">
      <option value="0">select option</option>
      <option th:each="beerQuantity : ${quantity}"  th:text="${beerQuantity}" th:value="${beerQuantity}"/>
  </select>
    <br>
    <label for="name">Stock</label><input type = "text" name = "stock" id = "stock"/>
    <br>
    <label for="container">Container</label>
    <select id="container" name="container">
        <option value="0">select option</option>
        <option th:each="container : ${container}" th:value="${container}" th:text="${container}">
        </option>
    </select>
  <br>
    <label for="name">Brewery</label><input type = "text" name = "brewery" id = "brewery"/>
    <br>
    <label for="name">Price</label><input type = "text" name = "price" id = "price"/>
    <br>
    <button type="submit">Add Beer</button>
</form>

</body>
</html>

<h1>Add Costumer</h1>
<form method="post">
  <label for="contact">Name</label><input type = "text" name = "contact" id = "contact"/>
  <br>
    <label for="companyName">Company Name</label><input type = "text" name = "companyName" id = "companyName"/>
    <br>
    <label for="address">Address</label><input type = "text" name = "address" id = "address"/>
    <br>
    <label for="email">Email</label><input type = "text" name = "email" id = "email"/>
    <br>
    <label for="phone">Phone Number</label><input type = "text" name = "phone" id = "phone"/>
    <br>
    <button type="submit">Add Costumer</button>
</form>

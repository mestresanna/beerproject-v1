    <meta charset="UTF-8">

    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
    </script>
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}"/>

<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
<!--<h1 th:utext="#{beers.header}">All Beers!</h1>-->
    <h1>All Beers!</h1>
</div>

<div class="container mt-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-2 justify-content-center">
        <!-- Targeta individual -->
        <div class="col " th:each="beer : ${beers}">
            <a href="detail/detailBeer.html" th:href="@{/beers/detailBeer(idBeer=${beer.getIdBeer()})}" class="text-decoration-none">
            <div class="card h-100 shadow-sm rounded text-center">
                    <img th:src="${beer.getImageUrl()}" class="card-img-top img-fluid w-50 mx-auto" alt="beer">
                    <div class="card-body">
                        <h5 class="card-title"  th:text="${beer.getName()}">Beer</h5>
                        <p class="card-text" th:text="${beer.getBrewery()}" >brewery
                        <p class="card-text" th:text="${beer.getQuantity().getSize()}">size</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

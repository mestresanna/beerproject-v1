<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Beers</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
    </script>
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}"/>
    <link rel="shortcut icon" href="#"/>


</head>
<body>
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">

    <!--<h1 th:utext="#{beers.header}">All Beers!</h1>-->
    <h1>All Beers!</h1>
</div>

<div class="container mt-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-2 justify-content-center">
        <!-- individual card -->
        <div class="col " th:each="beer : ${beers}">
            <div class="card h-100 shadow-sm rounded text-center">
                    <a th:href="@{/beers/delete(id=${beer.getIdBeer()})}"
                       class="btn btn-dark btn-sm custom-delete-btn position-absolute top-0 end-0 m-2"
                       onclick="return confirm('Are you sure you want to delete this beer?');">
                        &times;
                    </a>
                <a href="detail/detailBeer.html" th:href="@{/beers/detailBeer(idBeer=${beer.getIdBeer()})}" class="text-decoration-none">

                <img th:src="${beer.getImageUrl()}" class="card-img-top img-fluid w-50 mx-auto mt-4" alt="beer">
                    <div class="card-body text-black">
                        <h5 class="card-title"  th:text="${beer.getName()}">Beer</h5>
                        <p class="card-text" th:text="${beer.getBrewery()}" >brewery
                        <p class="card-text" th:text="${beer.getQuantity().getSize()}">size</p>
                    </div>
                </a>

            </div>
        </div>
    </div>
    <div class="position-relative text-center start-50 translate-middle-x mt-4">
        <a class="btn btn-primary bg-black text-white text-decoration-none text-center"
           th:href="@{/beers/add}">
            + Add Beer
        </a>
    </div>
</div>
<div th:if="${nonAlcoholBeer != null}">
    <div class="container mt-5">
        <h2>Non-Alcoholic Beer</h2>
    </div>

    <div class="container mt-4">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-2 justify-content-center">
            <!-- individual card -->
            <div class="col" th:each="beer : ${nonAlcoholBeer}">
                <div class="card h-100 shadow-sm rounded text-center">
                    <a th:href="@{/beers/delete(id=${beer.getIdBeer()})}"
                       class="btn btn-dark btn-sm custom-delete-btn position-absolute top-0 end-0 m-2"
                       onclick="return confirm('Are you sure you want to delete this beer?');">
                        &times;
                    </a>
                    <a href="detail/detailBeer.html" th:href="@{/beers/detailBeer(idBeer=${beer.getIdBeer()})}" class="text-decoration-none">

                        <img th:src="${beer.getImageUrl()}" class="card-img-top img-fluid w-50 mx-auto mt-4" alt="beer">
                        <div class="card-body text-black">
                            <h5 class="card-title" th:text="${beer.getName()}">Beer</h5>
                            <p class="card-text" th:text="${beer.getBrewery()}">brewery</p>
                            <p class="card-text" th:text="${beer.getQuantity().getSize()}">size</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

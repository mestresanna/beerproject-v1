<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
  </script>
  <link rel="stylesheet" href="/css/table.css" th:href="@{/css/table.css}"/>
</head>
<body>
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
<h1>All Orders!</h1>
</div>

<div class="container mt-4">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 justify-content-center">
    <div class="col " th:each="order : ${orders}">
      <a href="detail/detailOrder.html" th:href="@{/orders/detailOrder(idOrder=${order.getIdOrder()})}" class="text-decoration-none">
        <div class="card h-100 shadow-sm rounded text-center">
          <img th:src="${order.getImageUrl()}" class="card-img-top img-fluid w-50 mx-auto" alt="beer">
          <div class="card-body">
            <h5 class="card-title"  th:text="${order.getIdOrder()}">Contact</h5>
            <p class="card-text" th:text="${order.getCustomer().getContact()}" >Company</p>
          </div>
        </div>
      </a>
    </div>
  </div>
  <div class="position-fixed start-50 translate-middle-x mt-4">
    <a class="btn btn-primary bg-black text-white text-decoration-none text-center"
       th:href="@{/orders/add}">
      + Add Order
    </a>
  </div>
</div>

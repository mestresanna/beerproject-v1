<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
  </script>
  <link rel="stylesheet" href="../../static/css/table.css" th:href="@{/css/table.css}"/>
</head>
<body>
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
<h1>Orders</h1>
</div>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <table class="table table-striped table-hover">
        <thead class="table-light">
        <tr>
          <th scope="col">Customer</th>
          <th scope="col">List</th>
          <th scope="col">Comments</th>
          <th scope="col">Date</th>
          <th scope="col">Total Price</th>
        </tr>
        </thead>
        <tbody class="table-group-divider">
        <tr th:each="order : ${orders}">
          <!-- Mostra el contacte del client -->
          <td th:text="${order.getCostumer().getContact()}"></td>

          <!-- Mostra la llista de cerveses, pots ajustar la manera com es mostren -->
          <td th:text="${order.getBeers()}"></td>

          <!-- Mostra els comentaris de la comanda -->
          <td th:text="${order.getComments()}"></td>

          <!-- Mostra la data, pots aplicar format al backend si cal -->
          <td th:text="${order.getDate()}"></td>

          <!-- Mostra el preu total -->
          <td th:text="${order.getTotal()}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>



<div th:replace="~{fragments::footer}">
</div>

</body>
</html>

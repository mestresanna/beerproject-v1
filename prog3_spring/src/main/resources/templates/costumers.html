<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Costumers</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
    </script>
</head>
<body>
<div th:replace="~{fragments::header}">
</div>

<h1>Costumers</h1>

<table class="table">
    <thead>
    <tr>
        <th scope="col">Name</th>
        <th scope="col">Company Name</th>
        <th scope="col">Address</th>
        <th scope="col">Email</th>
        <th scope="col">Phone</th>
    </tr>
    </thead>
    <tbody class="table-group-divider">
    <tr th:each="costumer : ${costumers}">
        <td th:text="${costumer.getContact()}">Manola</td>
        <td th:text="${costumer.getCompanyName()}">HB</td>
        <td th:text="${costumer.getAddress()}">Gijselsstraat</td>
        <td th:text="${costumer.getEmail()}">hola@hb.com</td>
        <td th:text="${costumer.getPhone()}">+32 45678901</td>
    </tr>
    </tbody>
</table>
<div th:replace="~{fragments::footer}">
</div>

</body>
</html>

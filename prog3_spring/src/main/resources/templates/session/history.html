<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Beers</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"/>
  </script>
  <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="../../static/css/table.css" th:href="@{/css/table.css}"/>
    <link rel="shortcut icon" href="#"/>

</head>
<body>
<div th:replace="~{fragments::header}">
</div>
<div class="container mt-5">
  <!--<h1 th:utext="#{beers.header}">All Beers!</h1>-->
  <h1 th:text="'All Sessions of ' + ${ipAddr}">All Sessions!</h1>
</div>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-sm-12 col-md-8">
            <table class="table table-striped">
                <thead class="table-light">
                <tr>
                    <th scope="col">Page</th>
                    <th scope="col">TimeStamp</th>
                      </tr>
                </thead>
                <tbody class="table-group-divider">
                <tr th:each="history : ${sessionMap}">
                    <td th:text="${history.key}">Page</td>
                    <td>
                        <ul>
                            <li th:each="timestamp : ${history.value}" th:text="${timestamp}"></li>
                        </ul>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments::footer}">
</div>

</body>
</html>
